name: voiceover
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tts.py', 'pronunciation.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: voiceover
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthesise
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: python3 tts.py
      - name: Commit audio
        run: |
          git config user.name 'voiceover-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add audio
          git diff --cached --quiet || git commit -m 'audio: render voiceover [skip ci]'
          git push
